name: C UI preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c-ui-preview-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only C preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: preview
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
